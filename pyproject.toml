[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invest-ai"
version = "0.1.0"
description = "MVP investment analytics AI platform: MOEX candles, news sentiment (FinBERT/RuBERT), LSTM forecast"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
